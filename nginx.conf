# =============================================================================
# nginx.conf — Reverse Proxy Configuration (Approach C)
#
# TEMPLATE FILE: the placeholder ${BACKEND_HOST} is replaced at container
# startup by docker-entrypoint.sh via envsubst.
#
# To change the backend address, set the BACKEND_HOST environment variable
# when running the container (default: "backend:8080"). The value must match
# the docker-compose service name and port of the backend container.
# =============================================================================

worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Temp paths — writable by non-root user (UID 1001)
    # -------------------------------------------------------------------------
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # -------------------------------------------------------------------------
    # Security — hide nginx version in response headers and error pages
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # WebSocket upgrade map
    # Used by the /api/ location to support potential future WebSocket traffic.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Upstream backend
    # ${BACKEND_HOST} is replaced at startup by envsubst (default: backend:8080).
    # The value must correspond to a resolvable hostname — typically the
    # docker-compose service name of the backend container.
    # -------------------------------------------------------------------------
    upstream backend {
        server ${BACKEND_HOST};
    }

    # =========================================================================
    # Server block — single entry point on port 8080
    # =========================================================================
    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------
        # Security headers (server level)
        # Inherited by locations that do NOT define their own add_header.
        # Locations with custom add_header directives MUST repeat these.
        # -----------------------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # -----------------------------------------------------------------
        # API reverse proxy
        # All requests to /api/* are forwarded to the backend upstream.
        # proxy_pass has NO trailing URI — the original request path is
        # forwarded as-is (e.g. /api/users/123 → backend:8080/api/users/123).
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # Forward client information to the backend
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # WebSocket support (Upgrade headers are no-ops for plain HTTP)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffering
            proxy_buffering   on;
            proxy_buffer_size 4k;
            proxy_buffers     8 4k;
        }

        # -----------------------------------------------------------------
        # Vite build assets — content-hashed filenames, immutable cache
        # Files under /assets/ contain a hash in their name and never change,
        # so they can be cached aggressively for 1 year.
        # -----------------------------------------------------------------
        location /assets/ {
            # Security headers (repeated — required because add_header below
            # breaks inheritance from the server block)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -----------------------------------------------------------------
        # Runtime config — no cache
        # config.json is generated at container startup from environment
        # variables. Browsers must always fetch the current version.
        # -----------------------------------------------------------------
        location = /config.json {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # -----------------------------------------------------------------
        # SPA entry point — no cache
        # index.html must always be served fresh so that users receive the
        # latest asset references after a deployment.
        # -----------------------------------------------------------------
        location = /index.html {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # -----------------------------------------------------------------
        # Static files (favicon, icons, fonts) — 30 day cache
        # -----------------------------------------------------------------
        location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # -----------------------------------------------------------------
        # SPA fallback
        # Any request that does not match a real file or directory is served
        # by index.html, letting the React Router handle client-side routing.
        # -----------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------------------------------
        # Health check endpoint
        # Used by Docker HEALTHCHECK and Kubernetes liveness/readiness probes.
        # -----------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}

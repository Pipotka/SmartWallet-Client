# =============================================================================
# nginx.conf — Static Configuration (no envsubst required)
#
# This file is copied directly into the container at build time. It contains
# NO environment-variable placeholders and is NOT processed by envsubst.
#
# The configuration supports TWO operating modes:
#
#   1. Proxy mode   — BACKEND_HOST is set at runtime.
#                     The entrypoint generates upstream and proxy-location
#                     files in /etc/nginx/conf.d/ which are pulled in via
#                     the glob includes below. nginx serves static files AND
#                     proxies /api/* to the backend.
#
#   2. Static-only  — BACKEND_HOST is NOT set.
#                     No proxy files are generated. nginx serves ONLY static
#                     files. Use this mode when an external reverse proxy
#                     (e.g. a separate nginx container) handles API routing.
#
# The glob include directives silently match zero files when no proxy
# configuration is present — nginx does not error on empty glob includes.
# =============================================================================

worker_processes auto;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # -------------------------------------------------------------------------
    # Temp paths — writable by non-root user (UID 1001)
    # -------------------------------------------------------------------------
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # -------------------------------------------------------------------------
    # Security — hide nginx version in response headers and error pages
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # WebSocket upgrade map
    # Used by the /api/ proxy location (included via glob) to support
    # potential future WebSocket traffic. Harmless when proxy is disabled.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -------------------------------------------------------------------------
    # Conditional upstream backend (proxy mode only)
    # When BACKEND_HOST is set, the entrypoint generates
    # /etc/nginx/conf.d/upstream-backend.conf containing:
    #     upstream backend { server <BACKEND_HOST>; }
    # When BACKEND_HOST is NOT set, the glob matches nothing — no error.
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/upstream-*.conf;

    # =========================================================================
    # Server block — single entry point on port 8080
    # =========================================================================
    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------
        # Security headers (server level)
        # Inherited by locations that do NOT define their own add_header.
        # Locations with custom add_header directives MUST repeat these.
        # -----------------------------------------------------------------
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # -----------------------------------------------------------------
        # Conditional API reverse proxy (proxy mode only)
        # When BACKEND_HOST is set, the entrypoint generates
        # /etc/nginx/conf.d/proxy-backend.conf containing the location
        # /api/ block with proxy_pass, headers, and timeouts.
        # When BACKEND_HOST is NOT set, the glob matches nothing — no error.
        # Placed BEFORE static locations so /api/ takes priority.
        # -----------------------------------------------------------------
        include /etc/nginx/conf.d/proxy-*.conf;

        # -----------------------------------------------------------------
        # Vite build assets — content-hashed filenames, immutable cache
        # Files under /assets/ contain a hash in their name and never change,
        # so they can be cached aggressively for 1 year.
        # -----------------------------------------------------------------
        location /assets/ {
            # Security headers (repeated — required because add_header below
            # breaks inheritance from the server block)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # -----------------------------------------------------------------
        # Runtime config — no cache
        # config.json is generated at container startup from environment
        # variables. Browsers must always fetch the current version.
        # -----------------------------------------------------------------
        location = /config.json {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # -----------------------------------------------------------------
        # SPA entry point — no cache
        # index.html must always be served fresh so that users receive the
        # latest asset references after a deployment.
        # -----------------------------------------------------------------
        location = /index.html {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }

        # -----------------------------------------------------------------
        # Static files (favicon, icons, fonts) — 30 day cache
        # -----------------------------------------------------------------
        location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
            # Security headers (repeated — see note above)
            add_header X-Frame-Options        "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options "nosniff"                         always;
            add_header X-XSS-Protection       "1; mode=block"                  always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # -----------------------------------------------------------------
        # SPA fallback
        # Any request that does not match a real file or directory is served
        # by index.html, letting the React Router handle client-side routing.
        # -----------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # -----------------------------------------------------------------
        # Health check endpoint
        # Used by Docker HEALTHCHECK and Kubernetes liveness/readiness probes.
        # Always available in both proxy and static-only modes.
        # -----------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
